# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/publish.yml
#
# Release Pipeline — Build and Publish to PyPI
#
# Triggers when a new version tag (e.g., v0.1.0) is pushed to the repository.
# Builds the source distribution and wheel, runs tests, and publishes to PyPI.
# ─────────────────────────────────────────────────────────────────────────────

name: Build and Publish to PyPI

on:
  push:
    tags:
      - "v*" # Trigger on version tags (e.g. v1.0.0)

permissions:
  contents: read

jobs:
  test:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          python -m pytest tests/

  build-and-publish:
    name: "Build & Publish"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing / OIDC to PyPI
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build binary wheel and source tarball
        run: |
          python -m build

      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Set to true to verify on PyPI Test environment if needed
        # with:
        #   repository-url: https://test.pypi.org/legacy/
